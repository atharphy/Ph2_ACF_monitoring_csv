# GitLab CI -- Code Quality Checks

variables:
  REPORTS_PATH: ${CI_PROJECT_DIR}/artifacts/reports
  QUALITY_CHECK_DIR: ci-quality-checks



.cmake_prep: &cmake_prep |-
  source ./setup.sh
  mkdir -p build; cd build
  echo ${QUALITY_OPTIONS}
  echo cmake -GNinja -Wno-dev -B${QUALITY_CHECK_DIR} -S. \
        ${QUALITY_OPTIONS} \
        ..
  cmake -GNinja -Wno-dev -B${QUALITY_CHECK_DIR} -S. \
        ${QUALITY_OPTIONS} \
        .. \
        > >(tee ${REPORTS_PATH}/cmake-config.log) \
        2> >(tee ${REPORTS_PATH}/cmake-config.err >&2)

.quality:
  image: gitlab-registry.cern.ch/cms-iphc/tk_ph2/dockerimageph2acf
  tags:
    - cvmfs
  stage: quality
  needs: []
  allow_failure: true
  before_script:
    - echo "Running code quality checks before script"
    - yum install -y ninja-build iwyu cppcheck jq python3
    - pip3 install --user --upgrade python-gitlab requests
    - mkdir -p ${REPORTS_PATH}
  after_script:
    - echo "Running code quality checks after script"
    - ls -l ${CMAKE_DIR}
    - ls -l ${ARTIFACTS_DIR}/*
    - ls -l ${REPORTS_PATH}
  artifacts:
    paths:
      - artifacts

