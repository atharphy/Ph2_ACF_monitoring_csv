## Need an image with cppcheck, or an lcg path therewith
quality:cppcheck:
  extends: .quality
  variables:
    QUALITY_OPTIONS: -DRUN_CPPCHECK=ON
  script:
    - echo "Running code quality checks cppcheck script"
    - *cmake_prep
    - |
        cmake --build ${QUALITY_CHECK_DIR} \
              > >(tee ${REPORTS_PATH}/cppcheck.txt) \
              2> >(tee ${REPORTS_PATH}/cppcheck.err >&2) || true





# See: https://gitlab.cern.ch/gitlabci-examples/static_code_analysis
quality:cpplint:
  image: gitlab-registry.cern.ch/computersecurity/security-services-code-checking:latest
  stage: quality
  tags:
    - cvmfs
  stage: quality
  needs: []
  allow_failure: true

  before_script:
    - echo "Running code quality cpplint checks"
    - yum install -y python3
    - mkdir -p ${REPORTS_PATH}
  script:
    - python3 ${CI_PROJECT_DIR}/.gitlab/ci/scripts/runcpplint.py --files ./**/*.cxx ./**/*.cpp ./**/*.h ./**/*.hpp
    - mv cpplint-report.json ${REPORTS_PATH}
  after_script:
    - echo "Running code quality checks after script"
    - ls -l ${ARTIFACTS_DIR}/*
    - ls -l ${REPORTS_PATH}
  artifacts:
    expire_in: 1 month
    paths:
      - artifacts

code_quality:
  stage: quality
  allow_failure: false
  needs:
    - job: quality:cpplint
      artifacts: true
  before_script:
    - yum install -y jq
  script:
    - ls -l ${REPORTS_PATH}
    - bash ${CI_PROJECT_DIR}/.gitlab/ci/scripts/merge-reports.sh
  artifacts:
    reports:
      codequality: artifacts/reports/gl-code-quality-report.json
    paths: [artifacts/reports/gl-code-quality-report.json]
    expire_in: 1 month
