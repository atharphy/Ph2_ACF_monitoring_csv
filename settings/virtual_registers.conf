# RealtimeMonitor virtual registers are calculated from corrected RD53 values.
# Format: NAME | UNIT | SCOPE | EXPRESSION
# NAME is the unique Prometheus register label, for example HEADROOM_A.
# UNIT is the exported unit; leave it empty for a dimensionless result.
# SCOPE is chip or module; old three-field definitions default to chip.
# chip expressions use registers from the current chip: VINA - VDDA.
# module expressions can select a chip explicitly: VINA[0] + VINA[1].
# REGISTER[*] selects that register from every chip in the module.
# sum(ANA_IN_CURR[*]) adds the selected values.
# avg(VINA[*], VIND[*]) averages all values selected by both arguments.
# Expressions support numbers, +, -, *, /, unary signs, and parentheses.
# Missing inputs skip the result; restart RealtimeMonitor after configuration changes.


HEADROOM_A | | chip | ANA_SHUNT_CURR / ANA_IN_CURR
HEADROOM_D | | chip | DIG_SHUNT_CURR / DIG_IN_CURR
ILOAD_A | uA | chip | ANA_IN_CURR - ANA_SHUNT_CURR
ILOAD_D | uA | chip | DIG_IN_CURR - DIG_SHUNT_CURR

IIN_A | uA | module | sum(ANA_IN_CURR[*])
IIN_D | uA | module | sum(DIG_IN_CURR[*])
IIN | uA | module | sum(ANA_IN_CURR[*]) + sum(DIG_IN_CURR[*])
VIN | V | module | avg(VINA[*], VIND[*])
DIGITAL_CONSUMPTION | % | module | 100 * sum(DIG_IN_CURR[*]) / (sum(ANA_IN_CURR[*]) + sum(DIG_IN_CURR[*]))
ANALOG_CONSUMPTION | % | module | 100 * sum(ANA_IN_CURR[*]) / (sum(ANA_IN_CURR[*]) + sum(DIG_IN_CURR[*]))
