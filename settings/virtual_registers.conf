# ==============================================================================
# RealtimeMonitor virtual-register configuration
# ==============================================================================
#
# This file defines values that are calculated from physical RD53 monitoring
# values. Virtual registers do not cause additional hardware reads. They use the
# latest corrected values already received by PrometheusExporter for each chip.
#
# Default file location:
#   $PH2ACF_BASE_DIR/settings/virtual_registers.conf
#
# A different file can be selected before starting CMSITminiDAQ:
#   export CMSIT_VIRTUAL_REGISTER_CONFIG=/full/path/to/my_registers.conf
#
# This file is loaded when RealtimeMonitor starts. After changing it, stop and
# restart RealtimeMonitor. Rebuilding Ph2_ACF is not required.

#
# Line format
#

#   NAME | UNIT | EXPRESSION
#
# NAME
#   Name exported in the Prometheus "register" label. Names must be unique.
#   Using uppercase names with underscores is recommended.
#
# UNIT
#   Text exported in the Prometheus "unit" label. The exporter does not derive
#   or validate this unit, so it must be chosen consistently with the formula.
#   Leave the field empty for a dimensionless value:
#
#     VOLTAGE_RATIO | | VINA / VDDA
#
# EXPRESSION
#   Arithmetic expression evaluated independently for every
#   board/optical-group/hybrid/chip combination.

#
# Supported expression syntax
#

#   Addition:        VINA + VDDA
#   Subtraction:     VINA - VDDA
#   Multiplication:  VINA * ANA_IN_CURR
#   Division:        VINA / VDDA
#   Parentheses:     (VINA + VDDA) / 2
#   Numeric values:  VINA * 0.5
#   Unary signs:     -VINA or +(VINA - VDDA)
#
# Standard arithmetic precedence is used:
#   1. Parentheses
#   2. Multiplication and division
#   3. Addition and subtraction
#
# Register names may be unquoted:
#   (VINA * VDDA) / ANA_IN_CURR
#
# They may also be quoted:
#   ("VINA" * "VDDA") / "ANA_IN_CURR"
#
# Functions such as sqrt(), log(), exp(), and pow() are not currently supported.
# The power operator ^ is also not supported.

#
# Input-value behavior

#
# 1. Every physical register referenced by an expression must be enabled in the
#    Monitoring section of the hardware XML.
#
# 2. Expressions use corrected values. For example, the existing VINA, VDDA,
#    and current correction factors are applied before these formulas run.
#
# 3. Values are never combined across different chips. Each virtual value keeps
#    the board, optical_group, hybrid, and chip labels of its source values.
#
# 4. A virtual value is not published until all registers used by its expression
#    have been read for that chip.
#
# 5. An expression is skipped if it is invalid, uses an unavailable register,
#    produces a non-finite result, or attempts division by zero.
#
# 6. Virtual values are exported through cmsit_monitor_value. Virtual uncertainty
#    propagation is not currently implemented, so they are not exported through
#    cmsit_monitor_error.

#
# Editing rules
#

# - Blank lines are ignored.
# - Lines beginning with # are comments.
# - Use exactly two | separators on each active definition line.
# - Do not use | inside an expression.
# - Do not define the same virtual-register NAME more than once.
# - Malformed lines or duplicate names stop exporter initialization with an
#   error identifying the configuration line.
#
# Example definitions that can be copied and uncommented:
#
#   AVERAGE_VOLTAGE | V | (VINA + VDDA + VIND + VDDD) / 4
#   VOLTAGE_RATIO | | VINA / VDDA
#   TOTAL_POWER | uW | (VINA * ANA_IN_CURR) + (VIND * DIG_IN_CURR)


# Active virtual-register definitions

ANALOG_VOLTAGE_DROP | V | VINA - VDDA

