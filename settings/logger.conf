* GLOBAL:
    FORMAT                  =   "%datetime{%d.%M.%Y %H:%m:%s:%N} |%thread|%levshort| %msg"
    FILENAME                =   "logs/Ph2_ACF.log"
    ENABLED                 =   true
    TO_FILE                 =   true
    TO_STANDARD_OUTPUT      =   true
    MILLISECONDS_WIDTH      =   3
    PERFORMANCE_TRACKING    =   false
    MAX_LOG_FILE_SIZE       =   16777216 ## Throw log files away after 16MB
    LOG_FLUSH_THRESHOLD     =   10
* DEBUG:
    FILENAME                =   "logs/Ph2_ACF_debug.log"
    TO_STANDARD_OUTPUT      =   false
    ENABLED                 =   false
    LOG_FLUSH_THRESHOLD     =   10
    MAX_LOG_FILE_SIZE       =   16777216 ## Throw log files away after 16MB
* WARNING:
    ENABLED                 =   true
    FILENAME                =   "logs/Ph2_ACF_warn.log"
    TO_STANDARD_OUTPUT      =   true
* VERBOSE:
* ERROR:
    ENABLED                 =   true
    FILENAME                =   "logs/Ph2_ACF_err.log"
    TO_STANDARD_OUTPUT      =   true
* FATAL:
    ENABLED                 =   false
    FILENAME                =   "logs/Ph2_ACF_fatal.log"
    TO_STANDARD_OUTPUT      =   true
