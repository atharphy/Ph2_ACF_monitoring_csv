# Monitoring HTTP export settings. Restart CMSITminiDAQ after changes.
enabled = true
listen_address = localhost
port = 9101
metrics_path = /metrics

# Available families: value, error, last_update
metric_families = value,error,last_update

# Use * for all registers or provide a comma-separated allowlist.
register_allowlist = *

# Optional cabling database enrichment.
cabling_db_input = false
cabling_db_endpoint = http://localhost:8080/api/cabling
# Cabling database token can be provided via environment variable or directly in this config file.
cabling_db_token_env = CMSIT_CABLING_DB_TOKEN
cabling_db_timeout_seconds = 5