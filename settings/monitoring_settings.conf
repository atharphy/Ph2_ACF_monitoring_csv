# Ph2_ACF CSV monitoring
# Relative CSV paths are resolved from the hardware XML directory. A rotation
# value of 0 disables that limit; the first enabled limit reached rotates.
enabled = true
csv_output_directory = monitoring_csv
csv_rotate_size_mb = 100
csv_rotate_minutes = 60
csv_include_errors = true
csv_register_allowlist = *
virtual_register_config = settings/virtual_registers.conf

# lpGBT values share the RD53 CSV and use LPGBT_<register> column names.
lpgbt_csv_enabled = true
lpgbt_csv_register_allowlist = *

# Run the standalone DCA lookup before CMSITminiDAQ. auto reads
# <xml-basename>.csv beside the XML. Missing-file policy: warn or abort.
dca_mapping_file = auto
dca_mapping_failure_policy = warn

# Schedule options: always monitors throughout; percent monitors only inside
# monitor_percent_windows using native RD53 scan progress.
# Calibrations without a specific entry use this default.
monitor_schedule = always
monitor_percent_windows = 0-10,45-55,90-100

# These RD53 scans provide native completion progress.
calibration.pixelalive.monitor_schedule = percent
calibration.pixelalive.monitor_percent_windows = 0-10,45-55,90-100
calibration.noise.monitor_schedule = percent
calibration.noise.monitor_percent_windows = 0-10,45-55,90-100
calibration.scurve.monitor_schedule = percent
calibration.scurve.monitor_percent_windows = 0-10,45-55,90-100
calibration.gain.monitor_schedule = percent
calibration.gain.monitor_percent_windows = 0-10,45-55,90-100
calibration.gainopt.monitor_schedule = percent
calibration.gainopt.monitor_percent_windows = 0-10,45-55,90-100
calibration.threqu.monitor_schedule = percent
calibration.threqu.monitor_percent_windows = 0-10,45-55,90-100
calibration.thrmin.monitor_schedule = percent
calibration.thrmin.monitor_percent_windows = 0-10,45-55,90-100
calibration.thradj.monitor_schedule = percent
calibration.thradj.monitor_percent_windows = 0-10,45-55,90-100
calibration.latency.monitor_schedule = percent
calibration.latency.monitor_percent_windows = 0-10,45-55,90-100
calibration.injdelay.monitor_schedule = percent
calibration.injdelay.monitor_percent_windows = 0-10,45-55,90-100
calibration.clkdelay.monitor_schedule = percent
calibration.clkdelay.monitor_percent_windows = 0-10,45-55,90-100
calibration.clockdelay.monitor_schedule = percent
calibration.clockdelay.monitor_percent_windows = 0-10,45-55,90-100
calibration.gendacdac.monitor_schedule = percent
calibration.gendacdac.monitor_percent_windows = 0-10,45-55,90-100

# Open-ended modes do not publish a completion percentage.
calibration.physics.monitor_schedule = always
calibration.realtimemonitor.monitor_schedule = always

# External exporter options define its path, HTTP listener, metrics route, and
# CSV polling interval. They are not used by the Ph2_ACF process itself.
exporter_path = ../prometheus_exporter
exporter_listen_address = localhost
exporter_port = 9101
exporter_metrics_path = /metrics
exporter_scan_interval_seconds = 1

# Completed CSV files are removed only after Prometheus has scraped and its API
# confirms the exported generation. Modes: keep, archive_after_ack, delete_after_ack.
csv_cleanup_mode = archive_after_ack
csv_archive_directory = archive
csv_retention_hours = 168
csv_acknowledgement = prometheus_api
prometheus_server_url = http://localhost:9090
csv_min_confirmed_scrapes = 2
csv_exporter_source = auto
