[LogCollector.log]

[Producer.aida_tlu]
# Define the data collector to be used by the producer
EUDAQ_DC = the_dc
DISABLE_PRINT = 0

# Configuration
verbose = 0
confid = 20211126
skipconf = 0

# delay start in ms
delayStart = 0

# Generate internal triggers (in Hz, 0= no triggers)
InternalTriggerFreq= 0

####################################################
# DUT IN/OUTPUT
# Mask: 0 CONT, 1 SPARE, 2 TRIG, 3 BUSY (1 = driven by TLU, 0 = driven by DUT) 
# EUDET mode: 7
HDMI1_set = 0x7
HDMI2_ses = 0x7
HDMI3_set = 0x7
HDMI4_set = 0x7

# same as above for the clock line, 1 = AIDA mode, 2 = FPGA 
HDMI1_clk = 0
HDMI2_clk = 0
HDMI3_clk = 0
HDMI4_clk = 0
LEMOclk = 1   # if input, then also adjust clk.txt

# which DUTs are connected?
#HDMI1 =1, HDMI2=2, HDMI3=4, HDMI4=8, give hex number
#DUTMask = 0x1  # tele only
# Telescope at HDMI1, ref mod at HDMI3, RD53A at HDMI4
DUTMask = 0xD
#DUTMask = 0x5
# Telescope at HDMI1, ref mod at HDMI2, RD53A at HDMI3
#DUTMask = 0x7
# test without rd53 
# DUTMask = 0x5
#DUTMask = 0x1

# Define mode: 
# Each DUT channel has two bits: HDMI1=0&1 bit; HDMI2= 2&3bit; ...
# Only the lowest bit is significant:
# AIDA mode for each "1st" LSbit = 1
# EUDET modes incl. DUT clocking out each "1st" LSbit = 0
### e.g. 1st and 2nd channel in EUDET mode: 0xF0
### DUTMaskMode = 0xF0 # 1st and 2nd channel are reading out Trigger ID
### e.g. only 1st in EUDET mode
###DUTMaskMode = 0x00 # all in EUDET mode
#now we want HDMI2/HDMI3 in AIDA mode (for ref mod trigger)
#DUTMaskMode = 0x3C # 00 11 11 00 --> 4+8+16+32=60 in decimal = 3C in hex
DUTMaskMode = 0xFF #0x3C


#  Settings to ignore a busy line from a DUT
# e.g. to ignore the busy at HDMI1:  DUTIgnoreBusy = 0x1 
#DUTIgnoreBusy = 0x0 # no (full EUDET)
DUTIgnoreBusy = 0x4 # TLU ignores HMDI 3 (ref mod)
#DUTIgnoreBusy = 0x2 # TLU ignores HMDI 2 (ref mod)
#DUTIgnoreBusy = 0xC # TLU ignores HMDI 3 (ref mod) and 4 (rd53a) --> 4+8=12=0xC

# EXTERNAL TRIGGER INPUTs
# Stretch, delay in 6.25ns ticks
in0_STR = 1  # factor to stretch the width of the signal; to get coincidence 
in0_DEL = 0  # factor to delay, e.g. compensate  
in1_STR = 1
in1_DEL = 0
in2_STR = 1
in2_DEL = 0
in3_STR = 1
in3_DEL = 0
in4_STR = 0
in4_DEL = 0
in5_STR = 0
in5_DEL = 0

# DAC INPUT THRESHOLD
DACThreshold0 = -0.04
DACThreshold1 = -0.04
DACThreshold2 = -0.04
DACThreshold3 = -0.04
DACThreshold4 = -0.20
DACThreshold5 = -0.20

# PMT Power                                                                                         
PMT1_V = 0.80
PMT2_V = 0.80
PMT3_V = 0.80
PMT4_V = 0.80

###################################################
# Beam Trigger 

# 2 words 32bit: Hi + Lo
# combinations of coincidence are now possible! 
# have a look at the table in the TLU manual, chapter 5, to figure these out
# https://ohwr.org/project/fmc-mtlu/blob/master/Documentation/Main_TLU.pdf

# Coincidence of input 0 to 3 (telescope)
trigMaskHi = 0x00000000
trigMaskLo = 0x00008000

# Coincidence of input 0 and 1 (first two PMTs)
#trigMaskHi = 0x00000000
#trigMaskLo = 0x00000008

# New: Coincidence of any 3 of 4, 4 combinations plus all 4
#trigMaskHi = 0x00000000
#trigMaskLo = 0x0000C880





