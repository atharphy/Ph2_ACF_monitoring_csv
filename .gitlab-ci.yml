## RUN ##########

.run:
  stage: run
  needs:
    - build:StandAlone_woDS_c7
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
      allow_failure: false
    - when: manual
      allow_failure: true


## IT hybrid
run:IT:
  extends: .run
  before_script:
    - cp settings/CMSIT_CI.xml .
    - cp settings/RD53Files/CMSIT_RD53B.txt .
  script:
    - source ./setup.sh ci
    - CMSITminiDAQ -f CMSIT_CI.xml -r
    - CMSITminiDAQ -f CMSIT_CI.xml -c pixelalive
    - CMSITminiDAQ -f CMSIT_CI.xml -c threqu
    - CMSITminiDAQ -f CMSIT_CI.xml -c scurve
  after_script:
    - cp Results/Run000000_PixelAlive.root .
    - cp Results/Run000001_ThrEqualization.root .
    - cp Results/Run000002_SCurve.root .
    - gdb bin/ot_module_test core.* -ex where --batch > coreAnalysisRD53.log
    - cp coreAnalysisRD53.log .
  artifacts:
    paths:
      - Run000000_PixelAlive.root
      - Run000001_ThrEqualization.root
      - Run000002_SCurve.root
      - coreAnalysisRD53.log
    expire_in: 1 week

## 2S module
run:2S:
  extends: .run
  script:
    - source ./setup.sh ci
    - fpgaconfig -c settings/CMS2S_CI.xml -i 2s_cic1_18Aug
    - ot_module_test -f settings/CMS2S_CI.xml -t -m -a -b --reconfigure
  after_script:
    - cp Results/*/Hybrid.root .
    - gdb bin/ot_module_test core.* -ex where --batch > coreAnalysis2S.log
    - cp coreAnalysis2S.log .
  artifacts:
    paths:
      - Hybrid.root
      - coreAnalysis2S.log
      - MonitorResults/MonitorDQM*.root
    expire_in: 1 week


run:2S:python:
  extends: .run
  script:
    - source ./setup.sh ci
    - python3 pythonUtils/PythonController.py -f settings/CMS2S_CI.xml -c calibrationandpedenoise
  after_script:
    - cp Results/*/*.root .
  artifacts:
    paths:
      - Result.root
    expire_in: 1 week
  needs:
    - job: build:StandAlone_woDS_c7
      artifacts: true
    - job: run:2S
      artifacts: false


run:2S:DS:
  extends: .run
  script:
    - source ./setup.sh ci
    - supervisor -b -f settings/CMS2S_CI.xml -c calibrationandpedenoise
  after_script:
    - cp Results/*/*.root .
  artifacts:
    paths:
      - Result.root
    expire_in: 1 week
  needs:
    - job: build:StandAlone_wDS_c7
      artifacts: true
    - job: run:2S:python
      artifacts: false

## PS module
run:PS:
  extends: .run
  script:
    - source ./setup.sh ci
    - fpgaconfig -c settings/CMSPS_CI.xml -i ps_8m_5g_cic1_l12octa_l8dio5
    - ot_module_test -f settings/CMSPS_CI.xml -t -m -a -b --reconfigure
  after_script:
    - cp Results/*/Hybrid.root .
    - gdb bin/ot_module_test core.* -ex where --batch > coreAnalysisPS.log
    - cp coreAnalysisPS.log .
  artifacts:
    paths:
      - Hybrid.root
      - coreAnalysisPS.log
      - MonitorResults/MonitorDQM*.root
    expire_in: 1 week

## CHECK ##########

.check:
  stage: check
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
      allow_failure: false
    - when: manual
      allow_failure: true
  artifacts:
    paths:
      - plots
    expire_in: 1 week

check:IT:
  extends: .check
  needs:
    - run:IT
  script:
    - python3 pythonUtils/ci_tools/plot_canvas.py Run000000_PixelAlive.root "Detector/Board_0/OpticalGroup_0/Hybrid_0/Chip_15/D_B(0)_O(0)_H(0)_PixelAlive_Chip(15)" -o plots
    - python3 pythonUtils/ci_tools/plot_canvas.py Run000001_ThrEqualization.root "Detector/Board_0/OpticalGroup_0/Hybrid_0/Chip_15/D_B(0)_O(0)_H(0)_ThrEqualization_Chip(15)" -o plots
    - python3 pythonUtils/ci_tools/plot_canvas.py Run000002_SCurve.root "Detector/Board_0/OpticalGroup_0/Hybrid_0/Chip_15/D_B(0)_O(0)_H(0)_SCurves_Chip(15)" -o plots

check:2S:
  extends: .check
  needs:
    - run:2S
  script:
    - python3 pythonUtils/ci_tools/plot_hist.py Hybrid.root "Detector/Board_0/OpticalGroup_0/Hybrid_0/D_B(0)_O(0)_HybridNoiseDistribution_Hybrid(0)" -o plots


## DEPLOY ##########

deploy:
  stage: deploy
  trigger: cms_tk_ph2/docker_exploration
  rules:
    - if: $CI_COMMIT_TAG
      when: always
      variables:
        IMAGE_TAG: ph2_acf_$CI_COMMIT_TAG
        GIT_REF: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "Dev"
      when: always
      variables:
        IMAGE_TAG: nightly-dev
    - if: $DEBUG
      when: always
      variables:
        IMAGE_TAG: upstream-test
    - when: never
