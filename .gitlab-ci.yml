## YAML script for CI of Ph2_ACF Software/Middleware
## Author: Emery Nibigira (IPHC-Strasbourg, U. of Tennessee)
##         emery.nibigira@cern.ch

## Updates: Lawrence Lee (U. of Tennessee)
##          lawrence.lee.jr@cern.ch

## SETUP ##########

## The pipeline starts when a merge request is created
## or when the CI config is changed

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID || $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes: # when any file matching the below is edited, create a pipeline
        - .gitlab/ci/*
        - .gitlab/ci/*/*
        - .gitlab-ci.yml
      when: always
      allow_failure: true

image:
  name: gitlab-registry.cern.ch/cms_tk_ph2/docker_exploration/cmstkph2_ci_c7:latest
  entrypoint: ["/bin/sh","-c"]


variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - quality
  - build_c7
  - build_al8
  - build_al9
  - run
  - check
  - deploy

## QUALITY ##########

include:
  - .gitlab/ci/code-quality.yml


## BUILD C7 ##########

.build:
  stage: build_c7
  needs: []
  image:
    name: gitlab-registry.cern.ch/cms_tk_ph2/docker_exploration/cmstkph2_ci_c7:latest
    entrypoint: ["/bin/sh","-c"]
  before_script:
    - source ./setup.sh ci
  script:
    - mkdir -p build; cd build
    - cmake ..
    - make -j4
  artifacts:
    paths:
      - $CI_PROJECT_DIR/
    expire_in: 1 week

# Stand-alone application, without data streaming
build:StandAlone_woDS_c7:
  extends: .build
  # artifacts:
  #   paths:
  #     - bin/ot_module_test
  #     - bin/commission
  #     - bin/CMSITminiDAQ
  #   expire_in: 1 week

# Stand-alone application, with data streaming
build:StandAlone_wDS_c7:
  extends: .build
  before_script:
    - source ./setup.sh ci
    - export CompileForHerd=true
    - export CompileForShep=true

# Herd application
build:HerdApplication_c7:
  extends: .build
  before_script:
    - source ./setup.sh ci
    - export CompileForHerd=true
    - yum remove -y root #final home will not have ROOT. Should test build without it.

# Shep application
build:ShepApplication_c7:
  extends: .build
  before_script:
    - source ./setup.sh ci
    - export CompileForShep=true

# Compile with EUDAQ libraries
build:StandAlone_wEUDAQ_c7:
  extends: .build
  before_script:
    - source ./setup.sh ci
    - export CompileWithEUDAQ=true

# Compile with TC_USB library 
build:StandAlone_wTC_USB_c7:
  extends: .build
  before_script:
    - yum install -y libusb-devel libusbx-devel
    - source ./setup.sh ci
    - export CompileWithTCUSB=true

